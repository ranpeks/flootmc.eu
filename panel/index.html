<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090712">
    <title>Panel administracji — FlootMC</title>
    <link rel="stylesheet" href="../styles.css?v=20260806">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card panel-card">
            <div class="panel-profile" id="panel-profile"></div>
            <h1>Mój profil</h1>
            <p>Panel jest gotowy na przyszłe narzędzia aktualizacji strony i forum.</p>
            <hr>
            <h2>Zmień token / hasło</h2>
            <form id="password-form">
                <label>Nowy token / hasło<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
                <label>Powtórz token / hasło<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
                <p class="auth-message" id="password-message" aria-live="polite"></p>
                <button class="auth-submit" type="submit">Zapisz nowe hasło</button>
            </form>
            <button class="auth-secondary" id="logout" type="button">Wyloguj się</button>
            <a class="auth-back" href="../">Wróć na stronę główną</a>
        </section>
    </main>
    <script type="module">
        import { requireAdmin, changePassword, signOut } from '../auth.js';
        const admin = await requireAdmin();
        if (admin) document.querySelector('#panel-profile').innerHTML = `<img src="https://mc-heads.net/avatar/${encodeURIComponent(admin.skin)}/160" alt="Skin ${admin.label}"><div><strong>${admin.label}</strong><span>Administrator FlootMC</span></div>`;
        const form = document.querySelector('#password-form');
        const message = document.querySelector('#password-message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const { password, confirmPassword } = Object.fromEntries(new FormData(form));
            if (password !== confirmPassword) { message.textContent = 'Podane tokeny nie są identyczne.'; return; }
            const { error } = await changePassword(password);
            message.textContent = error ? 'Nie udało się zmienić hasła.' : 'Hasło zostało zmienione.';
            if (!error) form.reset();
        });
        document.querySelector('#logout').addEventListener('click', async () => { await signOut(); window.location.assign('/'); });
    </script>
</body>
</html>
