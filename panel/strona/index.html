<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090712">
    <title>Edycja treści strony — FlootMC</title>
    <link rel="stylesheet" href="../../styles.css?v=20260806">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card panel-card">
            <h1>Edycja treści strony</h1>
            <p>Zmiany zapisują się od razu i są widoczne na stronie głównej.</p>
            <form id="content-form"></form>
            <p class="auth-message" id="content-message" aria-live="polite"></p>
            <a class="auth-back" href="/panel/">Wróć do profilu</a>
        </section>
    </main>
    <script type="module">
        import { requireAdmin, getSiteContent, saveSiteContent } from '../../auth.js';
        await requireAdmin();
        const form = document.querySelector('#content-form');
        const message = document.querySelector('#content-message');
        const labels = {
            hero_title: 'Tytuł strony głównej', hero_subtitle: 'Podtytuł strony głównej', hero_image_url: 'Grafika strony głównej (URL)',
            logo_url: 'Logo (URL)', server_ip: 'Adres serwera', shop_url: 'Link do sklepu',
            admin_1_name: 'Administrator 1 — nick', admin_1_role: 'Administrator 1 — rola', admin_1_skin: 'Administrator 1 — skin',
            admin_2_name: 'Administrator 2 — nick', admin_2_role: 'Administrator 2 — rola', admin_2_skin: 'Administrator 2 — skin',
            admin_3_name: 'Administrator 3 — nick', admin_3_role: 'Administrator 3 — rola', admin_3_skin: 'Administrator 3 — skin',
            discord_url: 'Discord (URL)', facebook_url: 'Facebook (URL)', youtube_url: 'YouTube (URL)', footer_year: 'Rok w stopce'
        };
        const { data, error } = await getSiteContent();
        if (error) message.textContent = 'Nie udało się wczytać treści strony.';
        for (const item of data) {
            const label = document.createElement('label');
            label.textContent = labels[item.key] ?? item.key;
            const input = document.createElement('input');
            input.name = item.key;
            input.value = item.value;
            input.required = true;
            label.append(input);
            form.append(label);
        }
        const save = document.createElement('button');
        save.className = 'auth-submit';
        save.type = 'submit';
        save.textContent = 'Zapisz treść strony';
        form.append(save);
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = 'Zapisywanie…';
            for (const [key, value] of new FormData(form)) {
                const { error: saveError } = await saveSiteContent(key, value);
                if (saveError) { message.textContent = 'Nie udało się zapisać zmian.'; return; }
            }
            message.textContent = 'Zmiany zapisane.';
        });
    </script>
</body>
</html>
