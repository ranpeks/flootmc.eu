<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090712">
    <title>Reset hasła — FlootMC</title>
    <link rel="stylesheet" href="../styles.css?v=20260806">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="reset-title">
            <img src="https://i.imgur.com/WM6NQHV.png" alt="FlootMC" class="auth-logo">
            <h1 id="reset-title">Reset hasła</h1>
            <p id="reset-description">Podaj swój nick administracyjny. Wyślemy link do ustawienia nowego hasła na przypisany adres email.</p>

            <form id="request-form">
                <label>Nick administratora<input name="nick" autocomplete="username" required placeholder="np. og_ranpeks"></label>
                <p class="auth-message" id="request-message" aria-live="polite"></p>
                <button class="auth-submit" type="submit">Wyślij link resetujący</button>
            </form>

            <form id="recovery-form" hidden>
                <label>Nowe hasło<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
                <label>Powtórz nowe hasło<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
                <p class="auth-message" id="recovery-message" aria-live="polite"></p>
                <button class="auth-submit" type="submit">Zapisz nowe hasło</button>
            </form>

            <a class="auth-back" id="reset-back" href="/logowanie/">Wróć do logowania</a>
        </section>
    </main>
    <script type="module">
        import { sendPasswordReset, changePassword, signOut } from '../auth.js';

        const queryParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const recoveryMode = queryParams.get('recovery') === '1' || hashParams.get('type') === 'recovery';
        const requestForm = document.querySelector('#request-form');
        const recoveryForm = document.querySelector('#recovery-form');
        const description = document.querySelector('#reset-description');
        const backLink = document.querySelector('#reset-back');
        if (recoveryMode) {
            requestForm.hidden = true;
            recoveryForm.hidden = false;
            description.textContent = 'Wpisz i potwierdź nowe hasło do konta. Po zapisaniu zaloguj się ponownie.';
            backLink.href = '/reset-hasla/';
            backLink.textContent = 'Poproś o nowy link resetujący';
            recoveryForm.querySelector('input[name="password"]').focus();
        }

        const recoveryError = hashParams.get('error_description') || queryParams.get('error_description');
        if (recoveryError) {
            requestForm.hidden = true;
            recoveryForm.hidden = false;
            description.textContent = 'Link resetujący wygasł albo jest nieprawidłowy. Poproś o nowy link i otwórz go ponownie.';
            document.querySelector('#recovery-message').textContent = recoveryError.replaceAll('+', ' ');
            backLink.href = '/reset-hasla/';
            backLink.textContent = 'Poproś o nowy link resetujący';
        }

        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.querySelector('#request-message');
            message.textContent = 'Wysyłanie…';
            const { error } = await sendPasswordReset(new FormData(requestForm).get('nick'));
            message.textContent = error
                ? 'Nie udało się wysłać wiadomości. Sprawdź nick administratora i spróbuj ponownie.'
                : 'Jeśli konto istnieje, wiadomość z linkiem resetującym została wysłana.';
        });

        recoveryForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.querySelector('#recovery-message');
            const { password, confirmPassword } = Object.fromEntries(new FormData(recoveryForm));
            if (password !== confirmPassword) {
                message.textContent = 'Podane hasła nie są identyczne.';
                return;
            }

            message.textContent = 'Zapisywanie nowego hasła…';
            let error;
            try {
                ({ error } = await changePassword(password));
            } catch (requestError) {
                error = requestError;
            }
            if (error) {
                message.textContent = error.message || 'Nie udało się zapisać hasła. Spróbuj ponownie.';
                return;
            }

            await signOut();
            window.location.replace('/logowanie/?password-reset=success');
        });
    </script>
</body>
</html>
